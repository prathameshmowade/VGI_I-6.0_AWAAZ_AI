;; ============================================================================
;; PgBouncer Connection Pooler Configuration for Awaaz AI Multi-Tenancy
;; ============================================================================

[databases]
awaaz_db = host=postgis port=5432 dbname=awaaz_db auth_user=postgres

[pgbouncer]
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling allows 10,000+ client connections on 100 DB connections
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100

;; Timeout settings
server_idle_timeout = 600
client_idle_timeout = 1800
query_timeout = 30
server_connect_timeout = 15
