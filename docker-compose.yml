version: '3.8'

services:
  # 1. Full-Stack Web & API Gateway (Serves Vite Frontend + Express API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awaaz_web_gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@pgbouncer:6432/awaaz_db
      - MONGODB_URI=mongodb://mongo:27017/awaaz_db
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - pgbouncer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always

  # 2. Dedicated Asynchronous AI & Background Task Worker Pool
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awaaz_worker_pool
    command: ["node", "workers/complaintProcessorWorker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@pgbouncer:6432/awaaz_db
      - MONGODB_URI=mongodb://mongo:27017/awaaz_db
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - pgbouncer
    restart: always

  # 3. PostGIS Spatial Database & TimescaleDB Telemetry Store
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: awaaz_postgis
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=awaaz_db
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

  # 4. PgBouncer Connection Pooler (Handles 10,000+ Concurrent Conns)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: awaaz_pgbouncer
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgis
      - DB_NAME=awaaz_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:6432"
    depends_on:
      - postgis
    restart: always

  # 5. Redis Cluster (Task Queue, Edge Cache & WebSocket Pub/Sub Backplane)
  redis:
    image: redis:7-alpine
    container_name: awaaz_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgis_data:
  redis_data:
  uploads_data:
